# The check every change goes through: pull requests, main, the release branches (stores,
# watch) and ci-* branches. One workflow, one result: the last job, `tests-ok`, is the one to
# mark as required in a ruleset. It is green when every job that had something to check passed;
# jobs with nothing to check (a docs-only change) are skipped, not red, so a required check
# never hangs waiting for a run that a path filter swallowed.
#
# What runs is decided per job by the `changes` job (dorny/paths-filter), not by a workflow
# level `paths:`. That way the workflow always reports.
#
# Every run writes its numbers (tests and coverage per app area, slowest tests, runtime) to the
# job summary through scripts/ci/test-report.mjs and keeps them as the `test-stats` artifact.
name: Tests

on:
  pull_request:
  push:
    branches: [main, stores, watch, 'ci-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One run per PR or branch; a newer push makes the older run pointless.
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22
  FORCE_COLOR: '1'

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      frontend: ${{ steps.f.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch' }}
      mcp: ${{ steps.f.outputs.mcp == 'true' || github.event_name == 'workflow_dispatch' }}
      images: ${{ steps.f.outputs.images == 'true' || github.event_name == 'workflow_dispatch' }}
      android: ${{ steps.f.outputs.android == 'true' || github.event_name == 'workflow_dispatch' }}
      catalogue: ${{ steps.f.outputs.catalogue == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: f
        with:
          base: ${{ github.event_name == 'push' && github.ref_name || '' }}
          filters: |
            frontend:
              - '.github/workflows/test.yml'
              - 'scripts/ci/**'
              - 'frontend/**'
              - 'catalogue/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
            mcp:
              - '.github/workflows/test.yml'
              - 'scripts/ci/**'
              - 'mcp/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'frontend/src/lib/**'
            images:
              - '.github/workflows/test.yml'
              - 'Dockerfile'
              - 'nginx.conf'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'frontend/**'
              - 'catalogue/**'
              - 'scripts/**'
            android:
              - '.github/workflows/test.yml'
              - 'frontend/android/**'
              - 'frontend/package.json'
              - 'frontend/capacitor.config.json'
              - 'frontend/scripts/check-mobile-bundle.mjs'
              - 'scripts/android/**'
              - 'scripts/catalogue/stage-media.mjs'
              - 'pnpm-lock.yaml'
            catalogue:
              - '.github/workflows/test.yml'
              - 'catalogue/**'
              - 'scripts/catalogue/**'
              - 'frontend/src/lib/exercises-data.js'
              - 'frontend/src/instr/**'
              - 'frontend/src/exercise-names/**'
              - 'frontend/src/exercise-desc/**'

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Unit and component tests
        working-directory: frontend
        run: >
          pnpm exec vitest run
          --reporter=default --reporter=json --outputFile.json=test-results.json
          --reporter=junit --outputFile.junit=junit.xml
          --coverage --coverage.provider=v8 --coverage.include='src/**'
          --coverage.reporter=json-summary --coverage.reporter=text-summary
      - name: Web build
        run: pnpm run build
        working-directory: frontend
      - name: Bundle size
        run: node scripts/bundle-size.mjs --out bundle-size.json
        working-directory: frontend
      - name: Locale packs are in sync
        run: node scripts/check-locales.mjs
        working-directory: frontend
      - name: Untranslated strings in src (report only)
        run: node scripts/check-source-strings.mjs
        working-directory: frontend
      - name: Fatigue model property probe
        run: pnpm run test:fatigue-probe
        working-directory: frontend
      - name: Stats
        if: always()
        run: >
          node scripts/ci/test-report.mjs --label Frontend --root frontend
          --vitest frontend/test-results.json --coverage frontend/coverage/coverage-summary.json
          --bundle frontend/bundle-size.json --out stats/frontend.json
      - name: Test audit
        if: always()
        run: node scripts/ci/test-audit.mjs frontend/src frontend/scripts mcp/test > /dev/null
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: stats-frontend
          path: |
            stats/frontend.json
            frontend/junit.xml
          retention-days: 30
          if-no-files-found: ignore

  mcp:
    needs: changes
    if: needs.changes.outputs.mcp == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: MCP tests
        working-directory: mcp
        run: >
          pnpm exec vitest run
          --reporter=default --reporter=json --outputFile.json=test-results.json
          --coverage --coverage.provider=v8 --coverage.reporter=json-summary
      - name: Server loads in plain node
        run: pnpm run check:node-loadable
        working-directory: mcp
      - name: Stats
        if: always()
        run: >
          node scripts/ci/test-report.mjs --label MCP --root mcp
          --vitest mcp/test-results.json --coverage mcp/coverage/coverage-summary.json --out stats/mcp.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: stats-mcp
          path: stats/mcp.json
          retention-days: 30
          if-no-files-found: ignore

  catalogue:
    needs: changes
    if: needs.changes.outputs.catalogue == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Validate the catalogue
        run: node scripts/catalogue/validate.mjs
      - name: Generated files are up to date
        run: node scripts/catalogue/build.mjs --check
      - name: Media stay within 180 px (licence)
        run: node scripts/catalogue/check-media.mjs

  images:
    needs: changes
    if: needs.changes.outputs.images == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build web container
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: opengym:ci
          cache-from: type=gha,scope=ci-web
          cache-to: type=gha,mode=max,scope=ci-web
      - name: The web image boots and serves
        run: |
          docker run -d --name web -p 8080:80 opengym:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:8080/ >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS http://localhost:8080/ | grep -q 'id="root"'
          docker rm -f web

  android:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/stores' }}
          add-job-summary: on-failure
      - run: pnpm install --frozen-lockfile
      - name: Phone bundle + cap sync
        run: pnpm --filter opengym-frontend build:mobile
      - name: JVM unit tests, sideload APK, play flavour compiles
        working-directory: frontend/android
        run: ./gradlew --no-daemon testSideloadDebugUnitTest assembleSideloadDebug compilePlayDebugJavaWithJavac
      - name: Stats
        if: always()
        working-directory: frontend/android
        run: |
          {
            echo "### Android"
            for a in app/build/outputs/apk/sideload/debug/*.apk; do
              [ -f "$a" ] && echo "- debug sideload APK: $(numfmt --to=iec "$(stat -c %s "$a")") ($(basename "$a"))"
            done
            cat app/build/test-results/testSideloadDebugUnitTest/*.xml 2>/dev/null \
              | grep -o '<testsuite [^>]*' | sed -E 's/.*name="([^"]*)".*tests="([0-9]+)".*failures="([0-9]+)".*/- JVM: \1: \2 tests, \3 failed/' || true
          } >> "$GITHUB_STEP_SUMMARY"

  report:
    needs: [frontend, mcp]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: stats-*
          merge-multiple: true
          path: dl
      - name: Test report
        run: |
          set -- $(find dl -name '*.json' | sort)
          if [ $# -eq 0 ]; then echo "Nothing was tested in this run (no matching changes)." >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          node scripts/ci/test-report.mjs --combine "$@" --out combined.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-stats
          path: combined.json
          retention-days: 90
          if-no-files-found: ignore

  tests-ok:
    needs: [changes, frontend, mcp, catalogue, images, android]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every job passed or had nothing to check
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | node -e '
            const n = JSON.parse(require("fs").readFileSync(0, "utf8"))
            for (const [k, v] of Object.entries(n)) console.log(k.padEnd(10), v.result)
            const bad = Object.entries(n).filter(([, v]) => !["success", "skipped"].includes(v.result))
            if (bad.length) { console.log("::error::" + bad.map(([k, v]) => k + ": " + v.result).join(", ")); process.exit(1) }'
