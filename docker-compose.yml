name: opengym

services:
  opengym:
    build:
      context: .
      dockerfile: Dockerfile
    image: opengym:latest
    container_name: opengym
    restart: unless-stopped
    # Host port mapping is omitted so Dokploy routes traffic via Traefik without host port conflicts
    networks:
      - dokploy-network
      - default

networks:
  dokploy-network:
    external: true
